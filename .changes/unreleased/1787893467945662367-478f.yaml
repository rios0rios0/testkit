kind: 'Fixed'
body: 'made `BuilderFactory` safe for concurrent use. Its map was unsynchronised while `DefaultFactory` is a package-level singleton, so any `t.Parallel()` tests in a package -- and any helper goroutines they start -- wrote the same map concurrently -- and an unsynchronised concurrent map access is a runtime throw rather than a panic, so `recover` cannot catch it and the whole test binary dies with `fatal error: concurrent map writes` and no failing test to point at. Reads take an `RWMutex` read lock, since registration typically happens once during setup and every lookup after it is a read. `Create` deliberately calls the creation function after releasing the lock, so a creation function that registers further builders -- a composite registering its parts -- does not deadlock against the non-reentrant lock.'
